# Gitleaks: default rules + allowlist for research artifacts.
# scripts/hs-source/ holds saved copies of third-party pages (tws.by,
# ТН ВЭД / ЕТТ) captured during DF-17C recon as source evidence.
# Those pages embed the third-party site's own public frontend config
# (e.g. 'key':'...'), which trips the generic-api-key rule.
[extend]
useDefault = true

[allowlist]
description = "Research artifacts: saved third-party pages under scripts/hs-source/"
paths = [
  "^scripts/hs-source/",
]

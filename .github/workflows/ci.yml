# CI Logix: статические проверки + сквозной API-тест на живой PostgreSQL
# + поиск секретов. Merge в main — только при зелёном CI (branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: validate · tsc · lint · build
    runs-on: ubuntu-latest
    # v0.5.4: PostgreSQL-сервис + миграции + сид — интеграционные unit-тесты
    # (convert-atomic, password) требуют живую БД. Раньше они «зеленели»
    # через мок-ветку db.ts (localhost → in-memory mock) — фиктивный PASS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logix
          POSTGRES_PASSWORD: logix
          POSTGRES_DB: logix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logix"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://logix:logix@localhost:5432/logix?schema=public
      MASTER_PHONE: '+79000000000'
      MASTER_PASSWORD: ci-e2e-master-password # одноразовая БД раннера
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Урок v0.5.2 (26.10.2026): без пина setup-bun ставит latest —
          # дрейф тулчейна между прогонами невидим. Пин = последний
          # стабильный, проверенный на зелёном прогоне v0.5.1.
          bun-version: '1.4.4'
      - run: bun install
      - name: Схема Prisma валидна
        run: bunx prisma validate
      - name: Генерация клиента Prisma
        run: bunx prisma generate
      - name: Миграции (для интеграционных unit-тестов)
        run: bunx prisma migrate deploy
      - name: Сид
        run: bun run seed
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint
        run: bun run lint
      - name: Unit-тесты (vitest)
        run: bun run test
      - name: Сборка
        run: bun run build

  integrity:
    name: "integrity (G3/G4 — IC-01..IC-14, knip)"
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logix
          POSTGRES_PASSWORD: logix
          POSTGRES_DB: logix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logix"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://logix:logix@localhost:5432/logix?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4' # пин: см. комментарий в job checks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install
      - name: INVENTORY.md соответствует коду (IC-12)
        run: python3 scripts/inventory.py --check
      - name: Целостность IC-01..IC-14 (храповик)
        run: python3 scripts/integrity_check.py
      - name: knip — неиспользуемое (храповик G4)
        run: python3 scripts/knip_check.py

  e2e:
    name: e2e API (PostgreSQL)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logix
          POSTGRES_PASSWORD: logix
          POSTGRES_DB: logix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logix"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://logix:logix@localhost:5432/logix?schema=public
      MASTER_PHONE: '+79000000000'
      # Пароль только для одноразовой БД раннера
      MASTER_PASSWORD: ci-e2e-master-password
      ADMIN_PHONE: '+79000000000'
      ADMIN_PASSWORD: ci-e2e-master-password
      BASE_URL: http://localhost:3000
      # D31 + D78 (решение владельца 11.11.2026, приёмка Gate 2 DF-27):
      # подрядческий контур ПОЛНОСТЬЮ исключён из тестирования — флаг=false
      # (гард заморозки на проде), кабинетных сценариев нет в e2e_api_test.py,
      # отдельный шаг заморозки (e2e_contractor_frozen.py) удалён: он
      # проверял кабинет и процессы подрядчика — недопустимое косвенное
      # тестирование. Заморозка фиксируется только кодом (src/proxy.ts)
      # и IC-02/IC-03, без прогонов по подрядческим сущностям
      CONTRACTOR_PORTAL_ENABLED: 'false'
      # DF-03: диспетчер уведомлений — Bearer CRON_SECRET. Значение общее
      # для сервера и скрипта, одноразовое (раннер), не прод-секрет —
      # образец: ci-e2e-master-password. Урок 28.10: без переменной disp()
      # получал 403 «Недостаточно прав», очередь оставалась pending,
      # каскадно падали 10 проверок отправки (250/260).
      CRON_SECRET: ci-e2e-cron-secret
      # Урок 28.10 (вторая красная): EMAIL_PROVIDER не задан → дефолт
      # «none» (email.ts) → диспетчер ставил письмам skipped вместо sent,
      # 7 FAIL доставки (253/260). fake = фиктивная доставка, как в
      # .env песочницы, где e2e проходил 260/260.
      EMAIL_PROVIDER: fake
      # D11: base для ссылок в письмах (пернат от пустой ссылки в теле)
      APP_BASE_URL: http://localhost:3000
      # DF-09: ключ шифрования TOTP-секретов (AES-256-GCM) и подписи
      # challenge второго шага входа. Значение одноразовое (раннер),
      # не прод-секрет; на проде задаётся в Vercel (см. DEPLOY.md §Переменные)
      TOTP_ENCRYPTION_KEY: ci-e2e-totp-encryption-key
      # AUD-06 (поток A волна 1): `bun run start` поднимает NODE_ENV=production,
      # прод-гард хранилища (src/lib/storage.ts) без S3_* кидает StorageError
      # 500 на КАЖДУЮ загрузку документа. CI 10.11.2026 (первый прогон с
      # волной 1): все uploads 500, e2e падал каскадом (IndexError на пустом
      # списке документов). DEPLOY.md §Переменные предписывал флаг раннеру,
      # но в ci.yml добавлен только этим фиксом. Люк только для раннера —
      # на Vercel не задавать (файлы в эфемерном каталоге теряются).
      STORAGE_ALLOW_LOCAL: '1'
      # DF-17: в раннере без внешней сети — импорт курсов ЦБ выключен
      # (короткое замыкание в lib/cbr.ts, проход диспетчера не шумит)
      CBR_IMPORT: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4' # пин: см. комментарий в job checks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install
      - name: Версии тулчейна (дрейф раннера — видимым)
        run: |-
          echo "bun $(bun --version) | node $(node --version) | python3 $(python3 --version 2>&1 | awk '{print $2}')"
      - name: Миграции
        run: bunx prisma migrate deploy
      - name: Сид
        run: bun run seed
      - name: Сборка
        run: bun run build
      - name: Запуск приложения
        run: |
          nohup bun run start > next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat next.log; exit 1
      - name: Сквозной API-тест
        run: python3 scripts/e2e_api_test.py
      - name: Лог приложения при падении
        if: failure()
        run: |
          tail -200 next.log

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

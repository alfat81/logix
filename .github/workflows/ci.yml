# CI Logix: статические проверки + сквозной API-тест на живой PostgreSQL
# + поиск секретов. Merge в main — только при зелёном CI (branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: validate · tsc · lint · build
    runs-on: ubuntu-latest
    env:
      # Фиктивный: шаги этого job в БД не ходят
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Схема Prisma валидна
        run: bunx prisma validate
      - name: Генерация клиента Prisma
        run: bunx prisma generate
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: ESLint
        run: bun run lint
      - name: Unit-тесты (vitest)
        run: bun run test
      - name: Сборка
        run: bun run build

  e2e:
    name: e2e API (PostgreSQL)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logix
          POSTGRES_PASSWORD: logix
          POSTGRES_DB: logix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logix"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://logix:logix@localhost:5432/logix?schema=public
      MASTER_PHONE: '+79000000000'
      # Пароль только для одноразовой БД раннера
      MASTER_PASSWORD: ci-e2e-master-password
      ADMIN_PHONE: '+79000000000'
      ADMIN_PASSWORD: ci-e2e-master-password
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install
      - name: Миграции
        run: bunx prisma migrate deploy
      - name: Сид
        run: bun run seed
      - name: Сборка
        run: bun run build
      - name: Запуск приложения
        run: |
          nohup bun run start > next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat next.log; exit 1
      - name: Сквозной API-тест
        run: python3 scripts/e2e_api_test.py
      - name: Лог приложения при падении
        if: failure()
        run: tail -200 next.log

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
